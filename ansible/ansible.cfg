[defaults]
# Default inventory location
inventory = inventory/local/hosts.ini

# Roles location (relative to this ansible.cfg)
roles_path = ./roles

# SSH host key check বন্ধ (VM-friendly)
host_key_checking = False

# Retry files বন্ধ
retry_files_enabled = False

# Fact cache
gathering = smart

# 20টা VM একসাথে handle করবে
forks = 20

# Output format
stdout_callback = default
result_format   = yaml
# Timeout
timeout = 30

[ssh_connection]
# Performance boost
pipelining = True

# SSH connection options
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
