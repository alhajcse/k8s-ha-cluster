deployment:
  enabled: true
  kind: Deployment
  replicas: 2

service:
  enabled: true
  type: NodePort

ports:
  web:
    port: 8000
    exposedPort: 80
    nodePort: 30080
    expose:
      default: true

  websecure:
    port: 8443
    exposedPort: 443
    nodePort: 30443
    expose:
      default: true

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
